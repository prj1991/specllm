[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specllm"
version = "0.1.1"
description = "Makes any LLM behave like a regular REST API. Define the contract, specllm enforces it."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "specllm contributors"}
]
keywords = ["llm", "openapi", "api", "schema", "validation", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/prj1991/specllm"
Repository = "https://github.com/prj1991/specllm"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]

[tool.setuptools.packages.find]
include = ["specllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
